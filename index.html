<!DOCTYPE html>
<html lang="pt_PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To-Do List</title>
    <link rel="icon" href="pastafotos/icon.jpg" type="img/jpg">
    <script src="to-do.js" defer></script>
</head>
<body>
    <main>
        <section>
            <h1>Futuras Tarefas</h1>

            <article>
                <form id="form-tarefa">
                <label for="caixaentrada">Tarefa:</label>
                <input id="caixaentrada" type="text" placeholder="Digite a Nova Tarefa"/>
                <button type="submit">Adicionar</button>
                <ul id="lista"></ul>
                </form>
            </article>
        </section>
    </main>
    
</body>
</html>
